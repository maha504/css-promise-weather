<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Promise App</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #e0f7fa, #80deea);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .navbar {
        width: 100%;
        background-color: lightpink;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        box-shadow: 0 2px 10px rgba(34, 67, 0, 0.15);
        z-index: 1000;
      }

      .navbar .logo {
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
      }

      .navbar .nav-link a {
        color: darksalmon;
        font-weight: 500;
        font-size: 16px; 
        text-decoration: none;
        margin-left: 15px;
        transition: color 0.3s; 
      }

      .navbar .nav-link a:hover {
        color: #ffffff;
      }

      .weather-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(12, 45, 67, 0.2);
        text-align: center;
        width: 400px;
        margin-top: 80px; 
      }

      h1 {
        color: #006064;
        font-size: 28px;
        margin-bottom: 20px;
      }

      form {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
      }

      #cityname {
        flex: 1;
        padding: 10px 15px;
        border: 2px solid #b2ebf2;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }

      #cityname:focus {
        border-color: #00bcd4;
      }

      button {
        background-color: burlywood;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: aqua;
        color: #333;
      }

      #weatherresult {
        padding: 10px;
        border-radius: 12px;
        color: #333;
        font-size: 15px;
      }

      .main-weather-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
      }

      .weather-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 15px;
      }

      .detail-box {
        background: #f4f7f6;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        border-bottom: 3px solid #00bcd4;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }

      .detail-box strong {
        color: #006064;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail-box span {
        font-weight: 600;
        color: #555;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="#" class="logo">☁ weatherapp</a>
      <div class="nav-link">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <div class="weather-container">
      <h1>Promise Weather</h1>

      <form onsubmit="getweather(); return false;">
        <input
          type="text"
          name="cityname"
          id="cityname"
          placeholder="Enter city name..."
          required
        />
        <button type="submit">Check</button>
      </form>

      <div id="weatherresult">Enter a city and click check!</div>
    </div>
    
    <script src="./index.js"></script>
  </body>
</html>
